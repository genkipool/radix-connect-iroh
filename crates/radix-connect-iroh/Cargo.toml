[package]
name = "radix-connect-iroh"
description = "Radix Connect over iroh: a QUIC peer-to-peer transport between the Radix Wallet and the Radix Connector Extension, alternative to WebRTC."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["radix", "radixdlt", "iroh", "quic", "p2p"]
categories = ["cryptography::cryptocurrencies", "network-programming"]
readme = "../../README.md"

[dependencies]
iroh.workspace = true
blake3.workspace = true
bytes.workspace = true
hex.workspace = true
n0-future.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
zeroize.workspace = true

[dev-dependencies]
iroh = { workspace = true, features = ["test-utils"] }
tokio = { version = "1.44", features = ["rt-multi-thread", "macros", "time", "io-std", "io-util"] }

[lints]
workspace = true
